# Checks every pull request and every push to main: tests + both builds must pass.
# Turn on "Require status checks to pass" for main (Settings → Branches) so a red check blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # node:sqlite needs 22.5+
      - name: Tests
        run: npm test
      - name: Build (Cloudflare Worker assets)
        run: node build.mjs
      - name: Build (static copy)
        run: node build.mjs --static
