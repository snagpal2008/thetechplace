# Publishes the website to GitHub Pages (free) on every change to master.
# Live address: https://snagpal2008.github.io/thetechplace/   (custom domain: Settings → Pages → Custom domain)
#
# ONE-TIME SETUP: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Forms are saved by the Google Sheets backend (tools/apps-script/Code.gs) set in site/config.json → formsEndpoint.
name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
        working-directory: site
      - name: Check the Google Sheets backend matches the form rules
        run: node tools/build-apps-script.mjs && git diff --exit-code tools/apps-script/Code.gs
      # --static uses relative links, so the site works under /thetechplace/ and on a custom domain
      - name: Build
        run: node build.mjs --static
        working-directory: site
      - name: Custom domain (if set in site/CNAME)
        run: if [ -f site/CNAME ]; then cp site/CNAME site/dist-static/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
