name: Deploy to Cloudflare

# Needs only two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The D1 database, its schema and AUTH_SECRET are created automatically.

on:
  push:
    branches: [dilis-portal]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      D1_NAME: dilis-db
    steps:
      - name: Check Cloudflare secrets
        id: preflight
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping deploy — add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.preflight.outputs.ready == 'true'

      - name: Create D1 database if it doesn't exist
        if: steps.preflight.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "Creating D1 database $D1_NAME"
            npx wrangler d1 create "$D1_NAME" --location weur
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::Could not find or create D1 database"; exit 1; }
          echo "D1 database id: $ID"
          sed -i "s#REPLACE_WITH_D1_DATABASE_ID#${ID}#" wrangler.jsonc
          if [ -n "$APP_URL" ]; then
            sed -i "s#\"APP_URL\": \"[^\"]*\"#\"APP_URL\": \"${APP_URL}\"#" wrangler.jsonc
          fi

      - name: Apply database migrations
        if: steps.preflight.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Build and deploy Worker
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log

      - name: Ensure AUTH_SECRET exists
        if: steps.preflight.outputs.ready == 'true'
        run: |
          if npx wrangler secret list --format json | jq -e '.[] | select(.name == "AUTH_SECRET")' > /dev/null; then
            echo "AUTH_SECRET already set"
          else
            echo "Generating AUTH_SECRET"
            openssl rand -base64 48 | npx wrangler secret put AUTH_SECRET
          fi

      - name: Summary
        if: steps.preflight.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## Dílis portal deployed"
            echo ""
            echo "- Site: ${APP_URL:-$URL}"
            echo "- First visit: ${APP_URL:-$URL}/setup to create the admin account (and optional demo data)"
          } >> "$GITHUB_STEP_SUMMARY"
