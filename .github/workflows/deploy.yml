name: Deploy to Cloudflare

on:
  push:
    branches: [dilis-portal]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check deployment secrets
        id: preflight
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL HYPERDRIVE_ID; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping deploy — add these repository secrets first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.preflight.outputs.ready == 'true'

      - name: Inject Hyperdrive id and app URL into wrangler.jsonc
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sed -i "s#REPLACE_WITH_HYPERDRIVE_ID#${HYPERDRIVE_ID}#" wrangler.jsonc
          if [ -n "$APP_URL" ]; then
            sed -i "s#\"APP_URL\": \"[^\"]*\"#\"APP_URL\": \"${APP_URL}\"#" wrangler.jsonc
          fi

      - name: Run database migrations
        if: steps.preflight.outputs.ready == 'true'
        run: npm run db:migrate

      - name: Build and deploy Worker
        if: steps.preflight.outputs.ready == 'true'
        run: npm run deploy
