<!doctype html>
<html lang="en-IE" data-ga="">
<head>
<title>%TITLE%</title>
{{robotsMeta}}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.openstreetmap.org; frame-src https://www.openstreetmap.org; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="%DESCRIPTION%">
<link rel="canonical" href="{{domain}}%PATH%">
<meta property="og:title" content="%TITLE%">
<meta property="og:description" content="%DESCRIPTION%">
<meta property="og:url" content="{{domain}}%PATH%">
<!--#include head-->
%HEAD%
</head>
<body data-phone="{{phone247}}" data-api="{{formsEndpoint}}">
<!--#include header-->
<main id="main" tabindex="-1">
%BODY%
</main>
<!--#include footer-->
</body>
</html>
