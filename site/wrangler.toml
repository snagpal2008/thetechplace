# Cloudflare Workers + static assets (free plan). Setup steps: docs/08-hosting.md
# Dashboard build settings:  Root directory: site · Build command: node build.mjs · Deploy command: npx wrangler deploy
name = "thetechplace"   # must match the Worker name in the Cloudflare dashboard
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true    # keep https://thetechplace.<account>.workers.dev working
preview_urls = true   # each branch build gets its own preview link

# Build src/ → dist/ automatically before every `wrangler deploy` / `wrangler dev`,
# so the deploy works even if the dashboard's Build command is left empty.
[build]
command = "node build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "funeral-db"
# Paste the "Database ID" shown on your D1 database's page in the Cloudflare dashboard:
database_id = "8e818faa-e70e-4ba7-aded-e1bcf882dabb"

[observability]
enabled = true
