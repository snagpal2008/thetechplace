# Cloudflare Workers + static assets (free plan). Setup steps: docs/08-hosting.md
# Dashboard build settings:  Root directory: site · Build command: node build.mjs · Deploy command: npx wrangler deploy
name = "thetechplace"   # must match the Worker name in the Cloudflare dashboard
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "funeral-db"
# Paste the "Database ID" shown on your D1 database's page in the Cloudflare dashboard:
database_id = "8e818faa-e70e-4ba7-aded-e1bcf882dabb"

# Daily report email + data clean-up. Times are UTC: 07:05 UTC = 7:05 am Irish winter time, 8:05 am summer time.
[triggers]
crons = ["5 7 * * *"]

[observability]
enabled = true
